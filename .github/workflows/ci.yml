name: CI

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Build and push Docker images to GHCR after tests"
        type: boolean
        default: false

jobs:
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U stratum -d stratum_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://stratum:stratum@localhost:5432/stratum_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-for-testing-only
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==' }}
      JWT_SECRET: ci-jwt-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "15"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: apps/backend

      - name: Run ruff lint
        run: pip install ruff && ruff check app/
        working-directory: apps/backend

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml
        working-directory: apps/backend

      - name: Run integration tests
        run: pytest tests/integration/ -v
        working-directory: apps/backend

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage.xml
          flags: backend

  frontend-build:
    name: Frontend — Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Type check
        run: npx nuxi typecheck
        working-directory: apps/frontend

      - name: Build
        run: npm run build
        working-directory: apps/frontend
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
          NUXT_PUBLIC_WS_BASE: ws://localhost:8000

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-build]
    if: ${{ github.event.inputs.push_images == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/worker:${{ github.ref_name }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ vars.NUXT_PUBLIC_API_BASE || 'https://app.stratum.io/api' }}
            NUXT_PUBLIC_WS_BASE=${{ vars.NUXT_PUBLIC_WS_BASE || 'wss://app.stratum.io' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summary
        run: |
          echo "## Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/frontend:${{ steps.vars.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
