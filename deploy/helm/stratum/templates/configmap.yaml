apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: stratum
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ENVIRONMENT: {{ .Values.global.env | quote }}
  FRONTEND_URL: "https://{{ index .Values.ingress.hosts 0 "host" }}"
  BACKEND_URL: "https://{{ index .Values.ingress.hosts 0 "host" }}/api"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "10080"
  JWT_ACCESS_EXPIRE_MINUTES: "1440"
  MAX_QUERY_RUNTIME_SECONDS: "120"
  MAX_RESULT_ROWS: "10000"
  MAX_ROWS_PER_PAGE: "100"
  UNDO_MAX_ROWS_THRESHOLD: "5000"
  CONNECTION_TOKEN_EXPIRE_MINUTES: "60"
