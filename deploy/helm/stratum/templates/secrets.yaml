apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ if .Values.postgresql.enabled }}{{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.username .Values.secrets.postgresPassword .Release.Name .Values.postgresql.auth.database | quote }}{{ else }}{{ .Values.secrets.databaseUrl | quote }}{{ end }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_URL: {{ if .Values.redis.enabled }}{{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}{{ else }}{{ .Values.secrets.redisUrl | quote }}{{ end }}
